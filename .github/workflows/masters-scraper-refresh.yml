name: Masters Scraper Weekly Refresh

# scraper/masters/run_starter_ingest.py is a config-driven, confidence-gated ingest
# pipeline (targets in scraper/masters/targets.json). As of 2026-09-04 (Gate 1/2 of
# the masters Phase 1 write-path plan, memory masters_phase1_scope_2026-08-10) it
# writes directly to canonical.masters_programs / masters_program_pathways /
# masters_program_deadlines via scraper/masters/db.py, using the same per-field-
# provenance / never-downgrade-confidence pattern already proven on the UG
# deadline pipeline (scraper/db.py). It's still confidence-gated (validate_program
# rejects thin extractions before anything reaches the DB) and still emits
# tmp/scrape_dryrun.json / tmp/scrape_review.json for debugging, but the
# "generate SQL for a human to apply" staging step is gone — nobody applied one in
# months, and it was the actual blocker on masters data freshness (see CLAUDE.md's
# "GitHub Actions Workflows Summary" note, now stale as of this change).

on:
  schedule:
    - cron: '0 6 * * 3'  # weekly, Wednesday 06:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: masters-scraper-refresh
  cancel-in-progress: false

jobs:
  masters-scraper-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Preflight
        run: |
          set -euo pipefail
          test -f scraper/masters/run_starter_ingest.py || { echo "::error::run_starter_ingest.py missing"; exit 1; }
          test -f scraper/masters/targets.json || { echo "::error::targets.json missing"; exit 1; }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml python-dotenv asyncpg structlog pydantic-settings pydantic python-dateutil

      - name: Run masters starter ingest (writes to canonical.masters_* directly)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scraper.masters.run_starter_ingest

      - name: Upload scrape review artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: masters-scraper-review
          path: |
            tmp/scrape_dryrun.json
            tmp/scrape_review.json
          if-no-files-found: warn
          retention-days: 30
